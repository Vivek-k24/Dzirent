name: dzirent-local
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: dzirent
      POSTGRES_PASSWORD: local-disposable-only
      POSTGRES_DB: ${DZIRENT_DB_NAME:-dzirent_dev}
    ports:
      - "127.0.0.1:${DZIRENT_DB_PORT:-5432}:5432"
    volumes:
      - dzirent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzirent -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dzirent_pg:

name: Vercel production smoke

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: vercel-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for public deployment smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Check live catalog and product deep links on desktop and mobile
        env:
          DZIRENT_TEST_URL: https://dzirent.com
          DZIRENT_SKIP_WEBSERVER: '1'
        run: pnpm exec playwright test tests/workflows/storefront-smoke.spec.ts --config tests/workflows/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: production-smoke-failures
          path: test-results/workflows/
          retention-days: 7

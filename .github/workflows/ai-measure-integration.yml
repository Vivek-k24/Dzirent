name: AI-measure local integration

on:
  pull_request:
    paths:
      - 'services/ai-measure/**'
      - 'services/api/**'
      - 'apps/web/src/lib/ai-measure/**'
      - 'apps/web/src/components/ai-measure/**'
      - 'apps/web/src/app/dev/garment-measure/**'
      - 'apps/web/next.config.ts'
      - 'tests/workflows/garment-measure.spec.ts'
      - 'tests/workflows/paper-calibrate.spec.ts'
      - 'scripts/generate_ai_measure_fixtures.py'
      - '.github/workflows/ai-measure-integration.yml'

concurrency:
  group: ai-measure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  local-real-browser-api:
    name: Garment measurement browser through real FastAPI and OpenCV
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_DZIRENT_MODE: demo
      DZIRENT_ENVIRONMENT: test
      DZIRENT_MODE: demo
      DZIRENT_IDENTITY_MODE: mock
      DZIRENT_AIMEASURE_REAL_E2E: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.1
          python-version: 3.12.15
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory services/ai-measure --frozen --python 3.12.15
      - run: uv sync --directory services/api --frozen --python 3.12.15
      - name: Targeted backend measurement and dev-proxy unit tests
        run: |
          uv run --directory services/ai-measure --frozen pytest -q
          uv run --directory services/api --frozen pytest -q tests/test_dev_garment_measure.py tests/test_dev_paper_calibrate.py
      - name: Targeted frontend measurement unit tests
        run: pnpm --filter @dzirent/web exec vitest run src/lib/ai-measure
      - name: Generate synthetic garment with exact landmark/paper calibration and build frontend
        run: |
          uv run --directory services/ai-measure --frozen python ../../scripts/generate_ai_measure_fixtures.py
          pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Phase 2B real browser-to-Python measurements
        env:
          DZIRENT_GARMENT_MEASURE_URL: http://127.0.0.1:8310
        shell: bash
        run: |
          set -euo pipefail
          # Spawn the installed Python programs directly, so killing the AI-measure
          # PID later really takes the OpenCV service offline (no mock 503).
          services/ai-measure/.venv/bin/python -m dzirent_ai_measure --port 8310 >/tmp/ai-measure.log 2>&1 &
          measure_pid=$!
          services/api/.venv/bin/uvicorn dzirent_api.main:app --host 127.0.0.1 --port 8000 >/tmp/ai-measure-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$measure_pid" "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8310/health >/dev/null && curl -fsS http://127.0.0.1:8000/api/v1/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8310/health
          curl -fsS http://127.0.0.1:8000/api/v1/health/live
          # Preserve the original known-centimetre garment measurement regression.
          pnpm exec playwright test tests/workflows/garment-measure.spec.ts --config tests/workflows/playwright.config.ts
          # New Phase 2B: actual browser -> loopback Next -> API -> OpenCV paper snapping.
          pnpm exec playwright test tests/workflows/paper-calibrate.spec.ts --project=desktop --config tests/workflows/playwright.config.ts
          # Service-down evidence: the real child process is killed, while FastAPI stays up.
          kill "$measure_pid"
          for i in $(seq 1 20); do
            if ! curl -fsS --max-time 2 http://127.0.0.1:8310/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if curl -fsS --max-time 2 http://127.0.0.1:8310/health >/dev/null 2>&1; then
            echo "OpenCV worker still running; offline verification would be invalid" >&2
            exit 1
          fi
          DZIRENT_PAPER_SNAP_OFFLINE_TEST=1 pnpm exec playwright test tests/workflows/paper-calibrate.spec.ts --project=desktop --config tests/workflows/playwright.config.ts
      - name: Deployed-mode Next.js prototype route and rewrite denial
        shell: bash
        run: |
          set -euo pipefail
          # A separate preview-mode build is essential: rewrites are build-time config.
          VERCEL_ENV=preview pnpm build >/tmp/ai-measure-preview-build.log 2>&1 || { tail -100 /tmp/ai-measure-preview-build.log; exit 1; }
          VERCEL_ENV=preview pnpm --filter @dzirent/web start --port 3400 >/tmp/ai-measure-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -s http://127.0.0.1:3400/ >/dev/null; then break; fi
            sleep 1
          done
          page_code=$(curl -s -o /tmp/ai-measure-preview-route.txt -w '%{http_code}' http://127.0.0.1:3400/dev/garment-measure)
          proxy_code=$(curl -s -o /tmp/ai-measure-preview-api.txt -w '%{http_code}' -X POST http://127.0.0.1:3400/api/v1/dev/paper-calibrate)
          test "$page_code" = 404 || { echo "preview prototype visible: $page_code"; exit 1; }
          test "$proxy_code" = 404 || { echo "preview calibration rewrite exposed: $proxy_code"; exit 1; }
          echo "Preview mode denies prototype page and paper-calibrate rewrite (both 404)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ai-measure-integration-failures
          path: test-results/workflows/
          retention-days: 7

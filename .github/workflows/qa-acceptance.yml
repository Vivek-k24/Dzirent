name: QA Acceptance & Verification

on:
  pull_request:
  push:
    branches: [main, "codex/*", "claude/*", "antigravity/*"]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Target preview URL for deployment smoke verification"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  contracts:
    name: Independent Contract Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DZIRENT_MODE: demo
      DZIRENT_ENVIRONMENT: test
      DZIRENT_IDENTITY_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.1
          python-version: 3.12.15
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:sync
      - name: Run Independent Contract Tests
        run: pnpm exec playwright test --config tests/contracts/playwright.config.ts

  e2e:
    name: Multi-Browser & Accessibility E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DZIRENT_MODE: demo
      DZIRENT_ENVIRONMENT: test
      DZIRENT_IDENTITY_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers with Dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run E2E Test Suite
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deployment-smoke:
    name: Deployment Preview Smoke Check
    if: "${{ github.event.inputs.deployment_url != '' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Smoke Verification on Deployed URL
        env:
          DZIRENT_SMOKE_URL: "${{ github.event.inputs.deployment_url }}"
          DZIRENT_SKIP_WEBSERVER: "1"
        run: |
          pnpm smoke:web
          pnpm exec playwright test tests/e2e/foundation-baseline.spec.ts --project chromium-1440 --config tests/e2e/playwright.config.ts


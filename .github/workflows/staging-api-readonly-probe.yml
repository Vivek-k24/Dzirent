name: Staging API external read-only probe

on:
  push:
    branches: [codex/connected-staging-stage3]
    paths:
      - infra/azure/probe_staging_https.py
      - .github/workflows/staging-api-readonly-probe.yml

permissions:
  contents: read

concurrency:
  group: staging-api-readonly-probe
  cancel-in-progress: true

jobs:
  external-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Probe fixed Azure staging URL without credentials or writes
        run: python3 infra/azure/probe_staging_https.py --report "$RUNNER_TEMP/staging-https.json"
      - name: Record actual results, including failed or blocked checks
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/staging-https.json
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          report = Path(os.environ['REPORT_PATH'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('GET-only Azure staging probe. No secrets, email, accounts, deployment or database writes.\n\n')
              summary.write('```json\n' + (report.read_text() if report.exists() else '{"status":"report_not_produced"}') + '\n```\n')
          PY

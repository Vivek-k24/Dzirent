name: Foundation

on:
  pull_request:
  push:
    branches: [main, bootstrap/brief, bootstrap/foundation]

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DZIRENT_MODE: demo
      DZIRENT_ENVIRONMENT: test
      DZIRENT_IDENTITY_MODE: mock
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.1
          python-version: 3.12.15
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:sync
      - run: pnpm check
      - run: pnpm build
      - run: docker compose config --quiet
      - name: Install Chromium for bounded workflow smoke
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify only the current workflow E2E scenarios
        run: pnpm exec playwright test --config tests/workflows/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: workflow-failures
          path: test-results/workflows/
          retention-days: 7

  api-postgres:
    name: PostgreSQL workflow integration
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dzirent_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dzirent_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DZIRENT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/dzirent_ci_test
      DZIRENT_REQUIRE_DB_TESTS: "1"
      DZIRENT_MODE: demo
      DZIRENT_ENVIRONMENT: test
      DZIRENT_IDENTITY_MODE: mock
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.13.1
          python-version: 3.12.15
          enable-cache: true
      - run: uv sync --directory services/api --frozen --python 3.12.15
      - name: Verify persistence and cross-owner denial against real PostgreSQL
        run: >-
          uv run --directory services/api --frozen --python 3.12.15 pytest -q
          tests/test_listings.py::test_create_persists_and_server_assigns_identity
          tests/test_listings.py::test_cross_owner_access_is_non_enumerating_404
          tests/workflows

# Generates iosApp.xcodeproj: run `xcodegen generate` in mobile/iosApp after changing this file.
name: iosApp
options:
  bundleIdPrefix: com.dzirent
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # Search suggestions data, the same file Android ships (referenced, not copied).
      - path: ../shared/src/androidMain/assets/search_related.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Dzirent
        PRODUCT_BUNDLE_IDENTIFIER: com.dzirent.app
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # The Gradle build phase writes outside the Xcode script sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "shared"
          # Declared Age Range exists only on iOS 26+; weak so iOS 16-25 still launch.
          - "-weak_framework"
          - "DeclaredAgeRange"
        # Declared Age Range entitlement. Simulator only for now: a free (personal team) account
        # can't sign it for a device. With the paid account, enable the capability and drop the condition.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": iosApp/iosApp.entitlements
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: '"$SRCROOT/scripts/build-shared.sh"'
        basedOnDependencyAnalysis: false

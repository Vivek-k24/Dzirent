[versions]
agp = "8.10.1"
kotlin = "2.1.0"
composeMultiplatform = "1.7.3"
coil = "3.0.4"
navigation = "2.8.0-alpha10"
lifecycle = "2.8.4"
supabase = "3.0.3"
ktor = "3.0.3"
coroutines = "1.10.1"
serialization = "1.7.3"
datetime = "0.6.1"
datastore = "1.1.1"
playServicesLocation = "21.3.0"
exifinterface = "1.3.7"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
junit = "4.13.2"
aboutlibraries = "11.2.3"
# 34.x keeps Kotlin stdlib at 2.0.x, which this project's Kotlin 2.1.0 compiler reads.
firebaseBom = "34.19.0"
# Google Play Age Signals (P2C age gate). 0.0.4 was published 2026-07-20.
ageSignals = "0.0.4"
# Play services bring in Fragment 1.1.0; the system save picker (registerForActivityResult,
# P3A) needs 1.3.0 or newer (Lint InvalidFragmentVersionForActivityResult).
fragment = "1.8.5"
# C5: Stripe's own payment sheet (Android). 21.29.2 was published 2025-10-30 and is built on Kotlin
# stdlib 2.1.10 and Compose 1.7.8, which this project's Kotlin 2.1.0 / Compose Multiplatform 1.7.3
# read (the 23.x line needs Kotlin 2.3).
stripePaymentSheet = "21.29.2"

[libraries]
# Supabase
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }

# Ktor
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }

# Kotlinx
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }

# Compose Multiplatform extensions
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Coil 3
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Android specific
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Settings > About > Open-source licenses (the plugin collects them at build time)
aboutlibraries-compose-m3 = { group = "com.mikepenz", name = "aboutlibraries-compose-m3", version.ref = "aboutlibraries" }

# Push notifications (Firebase Cloud Messaging)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Age gate (Texas SB 2420, Utah): the app store's age range, never a birthdate
play-age-signals = { group = "com.google.android.play", name = "age-signals", version.ref = "ageSignals" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }

# Payments (C5): Stripe's payment sheet; the card never touches Dzirent's code
stripe-paymentsheet = { group = "com.stripe", name = "paymentsheet", version.ref = "stripePaymentSheet" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }

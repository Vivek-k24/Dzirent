# PROPOSED shared-root integration (owner of compose.yaml: Codex). Until integrated, use as an
# override from the repository root:
#   docker compose -f compose.yaml -f infra/runtime/compose.api.yaml up -d --build api
# Local demo only: mock identity in demo/local, disposable credentials, loopback ports.
services:
  api-migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: dzirent-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DZIRENT_DATABASE_URL: postgresql+psycopg://dzirent:local-disposable-only@db:5432/${DZIRENT_DB_NAME:-dzirent_dev}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    image: dzirent-api:local
    environment:
      DZIRENT_MODE: demo
      DZIRENT_ENVIRONMENT: local
      DZIRENT_IDENTITY_MODE: mock
      DZIRENT_DATABASE_URL: postgresql+psycopg://dzirent:local-disposable-only@db:5432/${DZIRENT_DB_NAME:-dzirent_dev}
      DZIRENT_CORS_ORIGINS: '["http://127.0.0.1:${DZIRENT_WEB_PORT:-3000}"]'
    ports:
      - "127.0.0.1:${DZIRENT_API_PORT:-8000}:8000"
    depends_on:
      api-migrate:
        condition: service_completed_successfully

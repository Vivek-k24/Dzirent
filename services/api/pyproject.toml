[project]
name = "dzirent-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "sqlalchemy==2.1.5",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "jsonschema==4.26.0",
  "pip-audit==2.10.1",
  "pre-commit==4.7.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dzirent_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# The local migration directory is named alembic; keep the package classified as third-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/dzirent_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

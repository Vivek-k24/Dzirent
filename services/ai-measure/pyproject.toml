[project]
name = "dzirent-ai-measure"
version = "0.1.0"
description = "Local/test-only CPU garment measurement from a US Letter reference and lender-placed points (AI-MEASURE-1)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "python-multipart==0.0.32",
  "numpy==2.5.3",
  "opencv-python-headless==4.14.0.94",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dzirent_ai_measure"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/dzirent_ai_measure"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
